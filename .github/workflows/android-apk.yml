name: Build and Publish Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Net-Hunter-Guide-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Net-Hunter-Guide-APK
          path: dist/*.apk

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --title "Net Hunter Guide $TAG" \
            --notes "Installable Android APK built automatically from the Net-Hunter repository. This initial GitHub release is debug-signed for direct installation and testing."
