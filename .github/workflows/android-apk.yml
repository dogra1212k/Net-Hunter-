name: Build Android APK and Play Bundle

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 != '' && secrets.PLAY_UPLOAD_STORE_PASSWORD != '' && secrets.PLAY_UPLOAD_KEY_ALIAS != '' && secrets.PLAY_UPLOAD_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run Android lint
        run: gradle :app:lint

      - name: Restore Play upload keystore
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/net-hunter-upload.jks"

      - name: Build installable debug APK
        if: env.HAS_PLAY_KEY != 'true'
        run: gradle :app:assembleDebug

      - name: Build unsigned Play Store AAB
        if: env.HAS_PLAY_KEY != 'true'
        run: gradle :app:bundleRelease

      - name: Build signed release APK and AAB
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ runner.temp }}/net-hunter-upload.jks
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          gradle :app:bundleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          if [ "$HAS_PLAY_KEY" = "true" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$APK_PATH" "dist/Net-Hunter-Guide-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Net-Hunter-Guide-${GITHUB_RUN_NUMBER}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Net-Hunter-Guide-APK
          path: dist/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Net-Hunter-Guide-AAB
          path: dist/*.aab
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -n 1)
          TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          if [ "$HAS_PLAY_KEY" = "true" ]; then
            NOTES="Signed release APK and signed AAB for Net Hunter Guide ${APP_VERSION}."
          else
            NOTES="Installable debug APK plus unsigned release AAB for Net Hunter Guide ${APP_VERSION}. Configure Play upload-key secrets before production Play Store submission."
          fi
          gh release create "$TAG" dist/*.apk dist/*.aab --title "Net Hunter Guide ${APP_VERSION}" --notes "$NOTES"
