name: Build Android APK and Play Bundle

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_PLAY_KEY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare Play signing
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          CONFIGURED_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          signing_unavailable() {
            echo "HAS_PLAY_KEY=false" >> "$GITHUB_ENV"
            echo "::warning::$1 Signed release artifacts will not be produced in this run."
            echo "Signing status: unavailable - $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ -z "$PLAY_UPLOAD_KEYSTORE_B64" ]             && [ -z "$PLAY_UPLOAD_STORE_PASSWORD" ]             && [ -z "$PLAY_UPLOAD_KEY_PASSWORD" ]; then
            echo "HAS_PLAY_KEY=false" >> "$GITHUB_ENV"
            echo "Signing status: not configured" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          [ -n "$PLAY_UPLOAD_KEYSTORE_B64" ] || signing_unavailable "Missing PLAY_UPLOAD_KEYSTORE_B64."
          [ -n "$PLAY_UPLOAD_STORE_PASSWORD" ] || signing_unavailable "Missing PLAY_UPLOAD_STORE_PASSWORD."
          [ -n "$PLAY_UPLOAD_KEY_PASSWORD" ] || signing_unavailable "Missing PLAY_UPLOAD_KEY_PASSWORD."

          raw=$(printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | tr -d '\r\n\t ')
          raw="${raw#PLAY_UPLOAD_KEYSTORE_B64=}"
          raw="${raw#data:application/octet-stream;base64,}"
          raw="${raw#data:application/x-java-keystore;base64,}"
          raw="${raw#\"}"
          raw="${raw%\"}"
          raw=$(printf '%s' "$raw" | tr '_-' '/+')

          remainder=$(( ${#raw} % 4 ))
          if [ "$remainder" -eq 2 ]; then
            raw="${raw}=="
          elif [ "$remainder" -eq 3 ]; then
            raw="${raw}="
          elif [ "$remainder" -eq 1 ]; then
            signing_unavailable "PLAY_UPLOAD_KEYSTORE_B64 has an invalid base64 length."
          fi

          KEYSTORE="$RUNNER_TEMP/net-hunter-upload.jks"
          if ! printf '%s' "$raw" | base64 --decode > "$KEYSTORE"; then
            signing_unavailable "PLAY_UPLOAD_KEYSTORE_B64 is not valid base64."
          fi

          [ -s "$KEYSTORE" ] || signing_unavailable "Decoded Play upload keystore is empty."

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$PLAY_UPLOAD_STORE_PASSWORD" >/dev/null 2>&1; then
            signing_unavailable "Decoded keystore could not be opened with PLAY_UPLOAD_STORE_PASSWORD."
          fi

          if [ -n "$CONFIGURED_ALIAS" ]; then
            alias_name="$CONFIGURED_ALIAS"
          else
            mapfile -t aliases < <(
              keytool -list -v                 -keystore "$KEYSTORE"                 -storepass "$PLAY_UPLOAD_STORE_PASSWORD"               | sed -n 's/^Alias name: //p'
            )

            if [ "${#aliases[@]}" -ne 1 ]; then
              signing_unavailable "A single key alias could not be auto-detected. Configure PLAY_UPLOAD_KEY_ALIAS."
            fi

            alias_name="${aliases[0]}"
          fi

          if ! keytool -list             -keystore "$KEYSTORE"             -storepass "$PLAY_UPLOAD_STORE_PASSWORD"             -alias "$alias_name" >/dev/null 2>&1; then
            signing_unavailable "The configured or detected upload-key alias was not found."
          fi

          echo "HAS_PLAY_KEY=true" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD_KEY_ALIAS=$alias_name" >> "$GITHUB_ENV"
          echo "Signing status: ready (alias: $alias_name)" >> "$GITHUB_STEP_SUMMARY"

      - name: Backup regression tests
        run: bash scripts/test-backup.sh

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lint

      - name: Build installable debug APK
        if: env.HAS_PLAY_KEY != 'true'
        run: gradle :app:assembleDebug

      - name: Build unsigned Play Store AAB
        if: env.HAS_PLAY_KEY != 'true'
        run: gradle :app:bundleRelease

      - name: Build signed release APK and AAB
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          gradle :app:bundleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          if [ "$HAS_PLAY_KEY" = "true" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          cp "$APK_PATH" "dist/Net-Hunter-Guide-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Net-Hunter-Guide-${GITHUB_RUN_NUMBER}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Net-Hunter-Guide-APK
          path: dist/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Net-Hunter-Guide-AAB
          path: dist/*.aab
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -n 1)
          TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"

          if [ "$HAS_PLAY_KEY" = "true" ]; then
            NOTES="Signed release APK and signed AAB for Net Hunter Guide ${APP_VERSION}."
          else
            NOTES="Installable debug APK plus unsigned release AAB for Net Hunter Guide ${APP_VERSION}. Play signing is not currently valid/configured."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.aab --clobber
            gh release edit "$TAG" --title "Net Hunter Guide ${APP_VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk dist/*.aab --title "Net Hunter Guide ${APP_VERSION}" --notes "$NOTES"
          fi
