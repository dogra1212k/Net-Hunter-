plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dogra.nethunterguide'
    compileSdk 37

    defaultConfig {
        applicationId "com.dogra.nethunterguide"
        minSdk 24
        targetSdk 37
        versionCode 10
        versionName "1.8.0"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("PLAY_UPLOAD_KEYSTORE")
            def storePasswordValue = System.getenv("PLAY_UPLOAD_STORE_PASSWORD")
            def keyAliasValue = System.getenv("PLAY_UPLOAD_KEY_ALIAS")
            def keyPasswordValue = System.getenv("PLAY_UPLOAD_KEY_PASSWORD")

            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("PLAY_UPLOAD_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
